<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ (isEdit ? 'CLIENTS.EDIT_CLIENT' : 'CLIENTS.NEW_CLIENT') | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="save()">
    <ion-item fill="outline" class="ion-margin-bottom">
      <ion-label position="stacked">{{ 'CLIENTS.NAME' | translate }} *</ion-label>
      <ion-input type="text" [(ngModel)]="name" name="name" required></ion-input>
    </ion-item>

    <ion-item fill="outline" class="ion-margin-bottom">
      <ion-label position="stacked">{{ 'CLIENTS.PHONE' | translate }}</ion-label>
      <ion-input type="tel" [(ngModel)]="phone" name="phone"></ion-input>
    </ion-item>

    <ion-item fill="outline" class="ion-margin-bottom">
      <ion-label position="stacked">{{ 'CLIENTS.ADDRESS' | translate }}</ion-label>
      <ion-input type="text" [(ngModel)]="address" name="address"></ion-input>
    </ion-item>

    <ion-item fill="outline" class="ion-margin-bottom">
      <ion-label position="stacked">{{ 'CLIENTS.HOURLY_RATE' | translate }} (€)</ion-label>
      <ion-input type="number" step="0.50" min="0" [(ngModel)]="hourlyRate" name="hourlyRate"></ion-input>
    </ion-item>

    <ion-item class="ion-margin-bottom">
      <ion-label>{{ 'CLIENTS.ACTIVE' | translate }}</ion-label>
      <ion-toggle slot="end" [(ngModel)]="isActive" name="isActive"></ion-toggle>
    </ion-item>

    <ion-button type="submit" expand="block" [disabled]="!name.trim()">
      {{ 'CLIENTS.SAVE' | translate }}
    </ion-button>
  </form>
</ion-content>
